<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache"><meta name="theme-color" content="#151C27"><title>Curso MDE</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MDE"><style>:root{--d0:#151C27;--d1:#1D2735;--d2:#263446;--db:#3A4A60;--db2:#4A5C76;--dm:#AEBBD0;--dt:#EAF2FF;--cyan:#58E1FF;--blue:#0A5BC4;--green:#4ADE9A;--amber:#FFC86B;--warm:#FAF7F2;--pale:#E9EFF7;--ink:#17202D;--ink2:#3B475A;--mut:#5A6679;--line:#C9D2DF;--ok:#0d7a4f;--okb:#e4f6ee;--bad:#b3261e;--badb:#fdecea;--warn:#8a5a00;--warnb:#fff4dc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--warm);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}

header svg{width:28px;height:28px;flex:none}header b{font-size:16px;letter-spacing:.3px}
.mode{margin-left:auto;font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:1.5px;padding:6px 9px;border-radius:99px;border:1px solid var(--db2);color:var(--dm)}
.mode.pr{border-color:var(--green);color:var(--green)}

h1{font-size:24px;line-height:1.2;margin:4px 0 12px}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;margin:0 0 4px}p{margin:0 0 10px}

.dkc .eyebrow,.panel .eyebrow{color:var(--cyan)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel{background:var(--d2);color:var(--dt);border:1px solid var(--db);border-radius:16px;padding:16px;margin-bottom:12px}
.panel .mut,.dkc .mut{color:var(--dm)}
.dkc{color:var(--dt)}
.dkc h1,.dkc h2{color:#fff}
.hero{background:var(--d0);color:var(--dt);border:1px solid var(--db)}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--pale);color:var(--blue);margin-right:6px}
.book{border-left:4px solid var(--blue);background:var(--pale);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.ok{background:var(--okb);color:var(--ok)}.bad{background:var(--badb);color:var(--bad)}.warn{background:var(--warnb);color:var(--warn)}
.note{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:15px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:48px;padding:12px 16px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;margin-top:10px}
.btn:disabled{background:#aab5c6;cursor:not-allowed}.btn.sec{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.panel .btn.sec,.dkc .btn.sec{color:var(--cyan);border-color:var(--cyan)}
.btn.go{background:var(--cyan);color:var(--d0)}
.lnk{background:none;border:0;color:var(--blue);font-weight:700;padding:8px 0;min-height:40px;text-align:left}
.panel .lnk,.dkc .lnk{color:var(--cyan)}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:12px 14px;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.panel .opt{background:var(--d1);border-color:var(--db2);color:var(--dt)}
.opt:hover{border-color:var(--blue)}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=email],input[type=number],input[type=password],input[type=date],textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.panel input,.panel textarea{background:var(--d1);border-color:var(--db2);color:#fff}
textarea{min-height:130px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px;margin:10px 0}.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.bar{height:10px;background:#dfe6f2;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--blue)}
.panel .bar,.hero .bar{background:var(--db)}.panel .bar i,.hero .bar i{background:var(--cyan)}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid var(--line);padding:12px 4px;color:var(--ink)}
.row:first-child{border-top:0}.row:disabled{color:#8b96a8}.row small{display:block;color:var(--mut);font-size:13px}
.dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--pale);color:var(--blue);border:2px solid var(--blue)}
.dot.d{background:var(--green);color:var(--d0);border-color:var(--green)}.dot.p{background:var(--warnb);color:var(--warn);border-color:var(--amber)}.dot.l{background:#eef1f5;color:#8b96a8;border-color:#d5dce8}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--d0);border-top:1px solid var(--db);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:152px;min-height:60px;background:none;border:0;color:var(--dm);font-size:12px;font-weight:700;border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--cyan);border-top-color:var(--cyan)}
.back{background:none;border:0;color:var(--blue);font-weight:700;padding:6px 0;min-height:40px}
.dkc .back{color:var(--cyan)}
.gl{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:8px 2px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--pale);padding:10px;border-radius:8px;font:14px/1.5 inherit}
svg.g{width:100%;height:auto;display:block}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cyan);outline-offset:1px}
/* cockpit */
.gauge{display:flex;align-items:center;gap:14px}.gauge svg{width:170px;flex:none}
.gauge .big{font:700 34px/1 ui-monospace,Menlo,monospace;color:#fff}
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.light{background:var(--d1);border:1px solid var(--db2);border-radius:12px;padding:10px 6px;text-align:center;color:var(--dm)}
.light b{display:block;font:700 12px/1.2 ui-monospace,Menlo,monospace;letter-spacing:1.5px;color:var(--dt);margin-top:6px}
.light small{display:block;font-size:11px;margin-top:2px}
.led{width:16px;height:16px;border-radius:50%;margin:0 auto;background:var(--db);border:2px solid var(--db2)}
.light.on{border-color:var(--green)}.light.on .led{background:var(--green);border-color:#b9f5d6;box-shadow:0 0 12px var(--green)}
.status{margin-top:12px;font:600 13px/1.4 ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--amber)}
.status.go{color:var(--green)}
.leg{display:flex;align-items:center;gap:10px;margin:22px 0 8px}.leg h2{margin:0;flex:1;font-size:17px}
.leg .cnt{font:700 12px ui-monospace,Menlo,monospace;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;min-height:42px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tog{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--d1);border:1px solid var(--db2);border-radius:12px;padding:12px;color:var(--dt);margin:8px 0;min-height:48px}
.tog i{width:22px;height:22px;border-radius:6px;border:2px solid var(--db2);flex:none}
.tog.on i{background:var(--green);border-color:var(--green)}
.quote{border-left:3px solid var(--cyan);padding:4px 12px;margin:10px 0;font-style:italic;color:var(--dt)}
.phase{display:flex;gap:4px;margin:6px 0 4px}.phase span{flex:1;height:6px;border-radius:4px;background:var(--db)}.phase span.on{background:var(--cyan)}
.lock{text-align:center;padding:24px 16px}.lock svg{width:56px;height:56px}
ul.ben{padding-left:20px;margin:8px 0}ul.ben li{margin:6px 0}
.reader{line-height:1.6}.reader p{margin:0 0 .8em}.reader h3{font-size:1.15em;margin:1em 0 .5em;color:var(--blue)}.reader .fn{font-size:.78em;color:var(--mut);margin-bottom:.4em}.reader img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;margin:8px 0}.reader mark{background:#fff0a8}
.pg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;overflow-wrap:anywhere;scroll-margin-top:70px}.pg.hl{border:2px solid var(--blue)}
.pl{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
.fs{display:flex;align-items:center;gap:8px}.fs button{min-width:48px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:700;color:var(--blue)}
summary{color:var(--blue);font-weight:600;font-size:14px;cursor:pointer;padding:8px 0}sup{font-size:.7em}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.miss{outline:2px solid #b3261e;outline-offset:2px;border-radius:10px;background:#fdecea}
textarea.miss,input.miss{outline:none;border:2px solid #b3261e;background:#fff5f4}
label.chk.miss{padding:6px 8px;color:#b3261e}
.tkb{min-width:42px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--blue);font-weight:700;flex:none}
.panel .tkb{background:var(--d1);border-color:var(--db2);color:var(--cyan)}
.panel select{background:var(--d1)!important;color:#fff;border-color:var(--db2)!important}
button.light{font:inherit;color:var(--dm);cursor:pointer}
.gterm{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-decoration:underline dotted #0A5BC4;text-decoration-thickness:2px;text-underline-offset:3px;cursor:help;min-height:0}
.panel .gterm,.dkc .gterm{text-decoration-color:var(--cyan)}
#p1sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--d0);color:var(--dt);border-top:2px solid var(--cyan);border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
#p1sheet h3{color:#fff;font-size:20px;margin:0 0 6px}#p1sheet .eyebrow{color:var(--cyan)}#p1sheet .btn.sec{color:var(--cyan);border-color:var(--cyan)}
#p1toast{position:fixed;top:12px;left:12px;right:12px;z-index:30;max-width:420px;margin:0 auto;display:flex;gap:12px;align-items:center;background:var(--d0);color:var(--dt);border:2px solid var(--green);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .5s,transform .5s}
#p1toast b{color:var(--green)}#p1toast.out{opacity:0;transform:translateY(-12px)}
.badge{display:inline-grid;place-items:center;flex:none;border-radius:50%;border:2px solid var(--db2);background:var(--d1);color:var(--dm);font-weight:700;font-family:ui-monospace,Menlo,monospace}
.badge.on{border-color:var(--amber);background:#3A2E12;color:var(--amber);box-shadow:0 0 10px rgba(255,200,107,.35)}
.brow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--db)}.brow:first-of-type{border-top:0}.brow small{display:block;color:var(--dm);font-size:13px}
.brow0{display:flex;gap:6px}
.dterm{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;color:var(--ink);min-height:48px}
.dterm span{flex:1}.dterm small{display:block;color:var(--mut);font-size:13px}.dterm i{font-style:normal;font-weight:700;color:var(--blue);font-size:20px;width:20px;text-align:center}
.ddef{padding:0 2px 12px;color:var(--ink2)}
details.card summary{font-size:16px}
.tipc{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.tipc .eyebrow{margin:0}.tipc b{font-size:17px}
.btn.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#1F8F4E;text-decoration:none}
.walink{text-align:center;margin:18px 0 0}.walink a{display:inline-flex;align-items:center;gap:6px;color:#1F8F4E;font-weight:700;text-decoration:none;padding:8px 4px;min-height:44px}
.badge2{display:inline-grid;place-items:center;flex:none}.badge2 svg{width:100%;height:auto}
svg.ins{display:block;filter:grayscale(1) brightness(.55);opacity:.45}svg.ins.on{filter:drop-shadow(0 0 6px rgba(255,200,107,.35));opacity:1}
.hallg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.hallg{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hcell{background:var(--d1);border:1px solid var(--db);border-radius:14px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.hcell.on{border-color:var(--amber);background:linear-gradient(180deg,#2A2414,#1D2735)}
.hcell b{color:var(--dm);font-size:14px;line-height:1.25;overflow-wrap:anywhere}.hcell.on b{color:#fff}
.hcell small{font-size:12px;line-height:1.3;color:var(--dm);overflow-wrap:anywhere}.hcell .ph{color:var(--dt);font-style:italic}.hcell .dt{color:var(--amber);font-weight:600}
#p1cer{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 30%,#2A2414 0,#0A0F17 60%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.cerbox{max-width:420px;width:100%;text-align:center;color:var(--dt)}
.cerw{display:flex;justify-content:center;animation:cerIn .9s cubic-bezier(.2,.8,.2,1.2) both}.cerw svg{max-width:70vw;height:auto}
.cerbox h2{color:#fff;font-size:26px;margin:4px 0 6px;animation:cerUp .6s .35s both}
.cern{color:#FFC86B;font-weight:700;font-size:18px;margin:0 0 8px;animation:cerUp .6s .5s both}
.cerp{font-style:italic;margin:0 0 6px;animation:cerUp .6s .65s both}.cerd{color:var(--dm);font-size:14px;margin:4px 0}
@keyframes cerIn{from{opacity:0;transform:scale(.55) translateY(20px)}to{opacity:1;transform:none}}
@keyframes cerUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.cerw,.cerbox h2,.cern,.cerp{animation:none}}
/* Terminal MDE */
.term{animation:tin .25s ease-out}.term.tout{animation:tout .17s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.97)}}
main.tboard-in{animation:tbin .28s ease-out}@keyframes tbin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.thero{position:relative;height:clamp(150px,24vh,200px);border-radius:16px;overflow:hidden;margin:-4px 0 10px;background:#151C27 center/cover no-repeat;border:1px solid var(--db)}
.thero .jw{position:absolute;inset:0;width:100%;height:100%}
.twel{position:absolute;left:14px;right:14px;bottom:10px}.twel h1{color:#fff;margin:2px 0 0;font-size:26px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.jwf path{stroke-dasharray:6 10;animation:jwfall 1.1s linear infinite}.jwf path:nth-child(2n){animation-duration:.85s}
@keyframes jwfall{to{stroke-dashoffset:-32}}
.jwm{animation:jwmist 4s ease-in-out infinite alternate}@keyframes jwmist{from{opacity:.55;transform:translateY(2px)}to{opacity:1;transform:translateY(-3px)}}
.jwl{animation:jwtw 2.4s ease-in-out infinite alternate}.jwl:nth-child(3n){animation-delay:.8s}@keyframes jwtw{from{opacity:.35}to{opacity:1}}
.tboard{background:#07090D;border:1px solid #2A3341;border-radius:12px;padding:8px 10px;margin-bottom:10px;display:grid;gap:6px}
.trow{display:flex;align-items:center;gap:8px;min-width:0}.tlab{flex:none;width:92px;font:700 9.5px/1.2 ui-monospace,Menlo,monospace;letter-spacing:1.2px;color:#8B97AA;text-transform:uppercase}
.flap{display:flex;flex-wrap:nowrap;overflow:hidden;min-width:0;gap:1px}.flap i{font:700 13px/1 ui-monospace,Menlo,monospace;font-style:normal;color:#F4F6FA;background:#161B24;border-radius:2px;padding:4px 1.5px;min-width:9px;text-align:center;box-shadow:inset 0 -1px 0 #000,inset 0 1px 0 #262E3B;animation:flip .45s both;transform-origin:50% 50%}
.flap.am i{color:#FFC86B}.tok{margin-left:auto;font:700 10px ui-monospace,Menlo,monospace;color:#4ADE9A;letter-spacing:1px;white-space:nowrap;text-transform:uppercase}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}60%{transform:rotateX(-12deg);opacity:1}100%{transform:none}}
.tgates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgate{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:76px;padding:10px 10px 9px;border-radius:12px;border:1px solid #2F3D52;background:linear-gradient(160deg,#1F2B3B,#151C27);color:#EAF2FF;font:inherit}
.tgate svg{position:absolute;right:10px;top:10px;width:22px;height:22px;fill:none;stroke:#58E1FF;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tgate b{font-size:14px;line-height:1.2;margin-top:4px;padding-right:4px}.tgate small{font-size:11.5px;color:#AEBBD0;line-height:1.25}
.tgate:active{transform:scale(.98)}.tgate:focus-visible{outline:3px solid var(--cyan)}
.tcode{display:inline-block;background:#FFC86B;color:#151C27;font:800 12px/1 ui-monospace,Menlo,monospace;padding:4px 7px;border-radius:5px;letter-spacing:.5px}
.tver{text-align:center;font-size:11px;color:#8B97AA;margin:8px 0 0}
.tgh{margin-bottom:12px}.tsign{display:flex;align-items:center;gap:10px;background:#0B0F16;color:#FFC86B;border-radius:10px;padding:10px 12px;font:800 14px/1.2 ui-monospace,Menlo,monospace;letter-spacing:1.2px;border:1px solid #2A3341}.tsign span:last-child{margin-left:auto}
body.dk .tgh .back,.tgh .back{color:var(--blue)}
#updbar{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));z-index:50;display:flex;align-items:center;gap:10px;background:#0B0F16;border:1px solid #FFC86B;color:#EAF2FF;border-radius:12px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#updbar .updtx{flex:1;min-width:0;font-size:14px}#updbar small{display:block;color:#FFC86B;font-size:12px}
#updbar button{flex:none;min-height:42px;border:0;border-radius:10px;background:#58E1FF;color:#151C27;font-weight:800;padding:0 12px}
@media (prefers-reduced-motion:reduce){.term,.term.tout,main.tboard-in,.flap i,.jwf path,.jwm,.jwl{animation:none!important}}

creasing one supports the others.","Uses a real example from the student’s job.","Copies the book without applying it, or treats responsibility as blame."]}},{"n":9,"t":"L + P","es":{"part":"2. Organización básica","act":"Lee el Capítulo 3: Comprender las Palabras Básicas de la Organización","prompt":"Aprueba una pregunta por concepto del Banco de preguntas.","ch":"Capítulo 3","p":17,"x":"“La comprensión cesa al pasarse una palabra o concepto malentendidos.”","crit":"Aprueba todos los conceptos.","res":"Ítem verificado"},"en":{"part":"2. Basic Organization","act":"Read Chapter 3: Understanding the Basic Words of Organization","prompt":"Pass one question per concept from the Question Bank.","ch":"Chapter 3","p":25,"x":"“Understanding ceases on going past a misunderstood word or concept.”","crit":"All concepts passed.","res":"Item verified"},"sec":null},{"n":10,"t":"L + P","es":{"part":"2. Organización básica","act":"Lee el Capítulo 4: Teoría de la Organización","prompt":"Aprueba una pregunta por concepto del Banco de preguntas.","ch":"Capítulo 4","p":19,"x":"“La organización consiste en que ciertas personas hagan ciertos trabajos.”","crit":"Aprueba todos los conceptos.","res":"Ítem verificado"},"en":{"part":"2. Basic Organization","act":"Read Chapter 4: The Theory of Organization","prompt":"Pass one question per concept from the Question Bank.","ch":"Chapter 4","p":27,"x":"“Organization consists of certain people doing certain jobs.”","crit":"All concepts passed.","res":"Item verified"},"sec":null},{"n":11,"t":"A","es":{"part":"2. Organización básica","act":"Ubica tu posición","prompt":"Dibuja dónde está tu posición en la compañía, de quién recibes trabajo y a quién lo envías.","ch":"Capítulo 4","p":19,"x":"“cada persona lleve todos los hats, sin importar cuál se le haya asignado.”","crit":"Muestra la posición, su superior y sus principales flujos de trabajo.","res":"Mapa de la posición"},"en":{"part":"2. Basic Organization","act":"Map your job","prompt":"Draw where rganization","act":"Read Chapter 6: What an Executive Wants on His Lines","prompt":"Pass one question per concept from the Question Bank.","ch":"Chapter 6","p":38,"x":"“Demands for decision are always indicative of irresponsibility”","crit":"All concepts passed.","res":"Item verified"},"sec":null},{"n":15,"t":"L + P","es":{"part":"2. Organización básica","act":"Lee el Capítulo 7: Tu Trabajo y Cómo Conservarlo","prompt":"Aprueba una pregunta por concepto del Banco de preguntas.","ch":"Capítulo 7","p":37,"x":"“En una organización, cualquier cosa es tu trabajo si hacerlo disminuye la confusión.”","crit":"Aprueba todos los conceptos.","res":"Ítem verificado"},"en":{"part":"2. Basic Organization","act":"Read Chapter 7: Your Job and How to Keep It","prompt":"Pass one question per concept from the Question Bank.","ch":"Chapter 7","p":43,"x":"“Anything in an organization is your job if it lessens the confusion if you do it.”","crit":"All concepts passed.","res":"Item verified"},"sec":null},{"n":16,"t":"A","es":{"part":"2. Organización básica","act":"Enumera tus deberes","prompt":"Escribe los deberes principales de tu posición.","ch":"Capítulo 7","p":37,"x":"“Hacer exactamente los deberes requeridos por tu posición de trabajo”","crit":"Los deberes son concretos y corresponden a la posición real.","res":"Lista de deberes"},"en":{"part":"2. Basic Organization","act":"List your duties","prompt":"Write the main duties of your job.","ch":"Chapter 7","p":43,"x":"“Your doing exactly the duties required by your job position”","crit":"Duties are concrete and match the real job.","res":"Duties list"},"sec":"puesto"},{"n":17,"t":"L + P + E","es":{"part":"2. Organización básica","act":"Lee el Capítulo 8 y escribe un ensayo","prompt":"Aprueba una pregunta por concepto del Banco de preguntas.","ch":"Capítulo 8","p":39,"x":"“¡La moral alta es el producto de la buena organización!”","crit":"Aprueba todos los conceptos y luego el ensayo: explica por qué una mejor organización puede mejorar la moral en tu área.","res":"Ensayo guardado"},"en":{"part":"2. Basic Organization","act":"Read Chapter 8 and write an essay","prompt":"Pass one question per concept from the Question Bank.","ch":"Chapter 8","p":45,"x":"“Good morale is the product of good organization!”","crit":"All concepts passed, then essay approved: explain why better organization can improve morale in your area.","res":"Essay saved"},"sec":"des","essay":{"es":["Organización y moral","Dice que la moral alta viene de la buena organización.","Identifica una debilidad específica de organización en el área del estudiante.","Describe una acción práctica de organización.","Propone amenazas, o da frases sobre la moral sin una acción de organización."],"en":["Organization and morale","States that good morale comes from good organization.","Identifies a specific organizational weakness in the student’s area.","Describes a practical organizing action.","Proposes threats, or offers morale slogans without an organizing action."]}},{"n":18,"t":"L + P","es":{"part":"3. Productos e intercambio","act":"Lee el Capítulo 9: Productos y Subproductos","prompt":"Aprueba una pregunta por concepto del Banco de preguntas.","ch":"Capítulo 9","p":43,"x":"“Un producto es un servicio o artículo terminado y de alta calidad en las manos del consumidor como intercambio por algo valioso.”","crit":"Aprueba todos los conceptos.","res":"Ítem verificado"},"en":{"part":"3. Products and Exchange","act":"Read Chapter 9: Products and Subproducts","prompt":"Pass one question per concept from the Question Bank.","ch":"Chapter 9","p":48,"x":"“A product is a finished, high-quality service or article in the hands of the consumer as an exchange for a valuable.”","crit":"All concepts passed.","res":"Item verified"},"sec":null},{"n":19,"t":"A","es":{"part":"3. Productos e intercambio","act":"Nombra tu producto","prompt":"Di qué entrega tu posición, ya terminado, y quién lo recibe.","ch":"Capítulo 9","p":44,"x":"“Tienes que nombrarlos”","crit":" 0","p":50,"x":"“el ingreso de la compañía y la paga de los empleados dependen de cuál de los cuatro intercambios anteriores”","crit":"Identifica el valor entregado y un intercambio honesto.","res":"Ensayo guardado"},"en":{"part":"3. Products and Exchange","act":"Write an essay","prompt":"Explain what value your job delivers to other people and what you receive in exchange.","ch":"Chapter 10","p":54,"x":"“company income and payroll depend upon which of the above four exchanges”","crit":"Identifies the value delivered and an honest exchange.","res":"Essay saved"},"sec":"des","essay":{"es":["Valor e intercambio en mi posición","Nombra lo que entrega la posición y quién lo recibe.","Explica el intercambio usando una condición del Capítulo 10.","Identifica una forma de entregar mejor valor.","No identifica a quien recibe, o describe solo esfuerzo y no valor."],"en":["Value and exchange in my job","Names what the job delivers and who receives it.","Explains the exchange using a condition from Chapter 10.","Identifies one way to deliver better value.","Does not identify a receiver or describes only effort, not value."]}},{"n":23,"t":"L + P","es":{"part":"4. Uso de las estadísticas","act":"Lee el Capítulo 11: Las Condiciones: Inexistencia y Por Encima de Ella","prompt":"Aprueba una pregunta por concepto del Banco de preguntas.","ch":"Capítulo 11","p":55,"x":"“Uno tiene que hacer los pasos de la fórmula de una Condición para mejorar su condición.”","crit":"Aprueba todos los conceptos.","res":"Ítem verificado"},"en":{"part":"4. Use of Statistics","act":"Read Chapter 11: The Conditions: Non-Existence and Above","prompt":"Pass one question per concept from the Question Bank.","ch":"Chapter 11","p":57,"x":"“One has to do the steps of a Condition formula in order to improve one’s condition.”","crit":"All concepts passed.","res":"Item verified"},"sec":null},{"n":24,"t":"L + P","es":{"part":"4. Uso de las estadísticas","act":"Lee el Capítulo 12: Las Condiciones: Por Debajo de Inexi
